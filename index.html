<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>库存和到货计划</title>
<style>
  :root{
    --bg:#f4f6fb; --card:#ffffff; --text:#1f2937; --muted:#6b7280;
    --line:#e5e7eb; --blue:#2563eb; --green:#16a34a; --amber:#f59e0b;
    --red:#dc2626; --orange:#f59e0b; --purple:#8b5cf6;
    --eta:#c2410c;                  /* ETA 段品牌到货（月区间聚合） */
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
       background:var(--bg);color:var(--text);font-size:14px;line-height:1.5;}
  .wrap{max-width:100%;margin:0 auto;padding:16px 14px 40px;}
  header h1{font-size:20px;margin:0 0 4px;font-weight:700;}
  header .sub{color:var(--muted);font-size:12px;}
  section{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin:14px 0;
          box-shadow:0 1px 2px rgba(0,0,0,.04);}
  section h2{font-size:14px;margin:0 0 10px;font-weight:700;}
  /* 搜索/筛选工具栏：滚动时固定在顶部，背景纯白遮住下方滚动内容 */
  .toolbar{position:sticky;top:0;z-index:6;background:#fff;padding:8px 0 6px;box-shadow:0 2px 6px rgba(0,0,0,0.06);}
  .toolbar .controls{margin-bottom:0;}
  .controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:10px;}
  .controls input[type=text]{padding:7px 10px;border:1px solid var(--line);border-radius:8px;width:170px;font-size:12px;}
  .controls input[type=text]+input[type=text]{margin-left:0;}
  .search-group{display:flex;gap:6px;flex-wrap:wrap;}
  .controls label{font-size:12px;color:var(--muted);display:inline-flex;align-items:center;gap:4px;cursor:pointer;}
  .controls .btn{margin-left:auto;padding:7px 14px;border:1px solid var(--line);background:#fff;border-radius:8px;
                 cursor:pointer;font-size:12px;font-weight:600;color:var(--blue);}
  .controls .btn:hover{background:#f0f5ff;}
  .table-scroll{width:100%;}
  table{width:100%;border-collapse:collapse;table-layout:fixed;font-size:12px;}
  th,td{padding:6px 7px;text-align:right;border-bottom:1px solid var(--line);white-space:normal;word-break:break-word;overflow-wrap:break-word;line-height:1.35;}
  th{background:#f9fafb;cursor:pointer;user-select:none;position:sticky;top:var(--toolbar-h, 100px);z-index:3;font-weight:600;color:#374151;word-break:break-all;text-align:center;vertical-align:middle;}
  td{vertical-align:middle;}
  th:hover{background:#eef2f7;}
  th.l,td.l{text-align:left;}
  tbody tr:hover{background:#f7faff;}
  td.remark-cell{white-space:normal;word-break:break-word;overflow-wrap:break-word;min-width:240px;max-width:280px;font-size:12px;color:#4b5563;line-height:1.45;}
  .row-danger{background:#fef2f2;}
  .row-danger td{color:#dc2626;font-weight:600;}
  .risk-card{display:flex;align-items:center;gap:10px;margin:6px 0 0;padding:8px 12px;background:#fff7ed;border:1px solid #fed7aa;border-radius:8px;font-size:13px;color:#9a3412;}
  .risk-card b{color:#dc2626;font-size:15px;margin:0 2px;}
  .risk-toggle{margin-left:auto;cursor:pointer;user-select:none;font-weight:600;}
  .risk-toggle input{vertical-align:-1px;margin-right:4px;}
  td.name-cell{white-space:normal;word-break:break-word;min-width:170px;max-width:240px;}
  td.upc-cell{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;color:var(--muted);white-space:nowrap;word-break:keep-all;}
  .code{color:var(--muted);font-variant-numeric:tabular-nums;}
  .minibar{height:5px;background:#eef2f7;border-radius:3px;margin-top:3px;overflow:hidden;}
  .minibar > i{display:block;height:100%;border-radius:3px;}
  .grp-hi{color:var(--blue);}     /* 极易可用库存 */
  .grp-bi{color:var(--green);}    /* 品牌可用库存 */
  .grp-jp{color:var(--purple);}   /* 极易到货数量 */
  .grp-pl{color:var(--amber);}    /* 品牌到货数量（具体日期） */
  .grp-eta{color:var(--eta);}     /* 品牌到货数量ETA段（月区间聚合） */
  .legend{font-size:11px;color:var(--muted);margin-top:6px;line-height:1.7;}
  .legend span.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin:0 3px 0 6px;vertical-align:middle;}
  .empty{text-align:center;color:var(--muted);padding:20px;}
  /* 合计行：钉在最底部，滚动时常驻可见；仅对筛选后可见产品求和 */
  tfoot.total-row td{position:sticky;bottom:0;z-index:2;background:#1f2937;color:#fff;font-weight:700;border-top:2px solid #374151;text-align:right;}
  tfoot.total-row td.total-label{text-align:left;color:#fcd34d;}
  tfoot.total-row td.total-na{color:#9ca3af;font-weight:400;}
  /* ---- 钻取明细弹窗 ---- */
  td.clickable{cursor:pointer;text-decoration:underline;text-decoration-style:dotted;text-decoration-color:var(--muted);}
  td.clickable:hover{background:#eef4ff;color:var(--blue);}
  .overlay{position:fixed;inset:0;background:rgba(15,23,42,.45);display:none;align-items:flex-start;justify-content:center;
           padding:48px 16px;z-index:50;overflow:auto;}
  .overlay.show{display:flex;}
  .modal{background:#fff;border-radius:14px;max-width:700px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.28);overflow:hidden;animation:pop .12s ease-out;}
  @keyframes pop{from{transform:translateY(8px);opacity:.6}to{transform:translateY(0);opacity:1}}
  .m-head{display:flex;align-items:flex-start;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line);background:#f9fafb;}
  .m-head h3{margin:0;font-size:15px;font-weight:700;}
  .m-head .sub{color:var(--muted);font-size:12px;margin-top:4px;line-height:1.5;}
  .m-close{margin-left:auto;border:none;background:#e5e7eb;width:30px;height:30px;border-radius:8px;cursor:pointer;
           font-size:18px;line-height:1;color:#475569;flex:none;}
  .m-close:hover{background:#d1d5db;}
  .m-body{padding:14px 18px 20px;}
  .m-body table{table-layout:auto;font-size:13px;margin:0;}
  .m-body th,.m-body td{padding:7px 10px;border-bottom:1px solid var(--line);}
  .m-body th{background:#fff;position:static;color:#374151;}
  .m-body tbody tr:hover{background:#f7faff;}
  .m-tot{margin-top:12px;font-size:12.5px;color:var(--muted);border-top:1px dashed var(--line);padding-top:10px;}
  .m-tot b{color:var(--text);}
  .ok{color:var(--green);font-weight:600;}
  .warn{color:var(--red);font-weight:600;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>库存和到货计划</h1>
    <div class="sub">以 UPC 为唯一维度关联 · 底表：产品清单（共 <span id="nBase"></span> 个 UPC） · 生成时间：<span id="genDate"></span></div>
  </header>

  <section>
    <h2>库存与到货明细（按 UPC 聚合）</h2>
    <div class="toolbar">
      <div class="controls">
        <div class="search-group">
          <input type="text" id="qGnc"   placeholder="搜索 CODE"       autocomplete="off">
          <input type="text" id="qSap"   placeholder="搜索 产品编码"  autocomplete="off">
          <input type="text" id="qUpc"   placeholder="搜索 UPC"        autocomplete="off">
          <input type="text" id="qName"  placeholder="搜索 产品名称"  autocomplete="off">
        </div>
        <label><input type="checkbox" id="fJiyi"> 仅显示有极易可用库存</label>
        <label><input type="checkbox" id="fBrand"> 仅显示有品牌可用库存</label>
        <label><input type="checkbox" id="fPlan"> 仅显示有到货计划</label>
        <button class="btn" id="exportBtn">导出 CSV</button>
      </div>
      <div class="risk-card" id="riskCard">
        <span class="risk-icon">⚠️</span>
        <span class="risk-text">风险商品（售止 / 下市 / 停产）：<b id="riskCount">0</b> 个</span>
        <label class="risk-toggle"><input type="checkbox" id="fRisk"> 仅看风险商品</label>
      </div>
    </div>
    <div class="table-scroll">
      <table id="tbl">
        <colgroup><col style="width:44px"><col style="width:50px"><col style="width:75px"><col style="width:100px"><col style="width:170px"><col style="width:76px"><col style="width:76px"><col style="width:72px"><col style="width:68px"><col style="width:68px"><col style="width:68px"><col style="width:68px"><col style="width:68px"><col style="width:68px"><col style="width:68px"><col style="width:68px"><col style="width:58px"><col style="width:58px"><col style="width:80px"><col style="width:80px"><col style="width:250px"></colgroup>
        <thead>
          <tr id="theadRow"></tr>
        </thead>
        <tbody id="tbody"></tbody>
        <tfoot id="tfoot"></tfoot>
      </table>
    </div>
    <div class="legend">
      <b>说明：</b>橙色行 = 极易可用库存为 0 但品牌仍有库存（建议向品牌方采货）。配色—— <span class="grp-hi"><span class="dot" style="background:var(--blue)"></span>极易可用库存 / 极易剩余效期</span> · <span class="grp-bi"><span class="dot" style="background:var(--green)"></span>品牌可用库存 / 品牌剩余效期</span> · <span class="grp-jp"><span class="dot" style="background:var(--purple)"></span>极易到货（按到货日期分列）</span> · <span class="grp-pl"><span class="dot" style="background:var(--amber)"></span>品牌到货（按到货日期分列）</span> · <span class="grp-eta"><span class="dot" style="background:var(--eta)"></span>品牌到货 ETA 段（按月区间聚合，ETA=预计到货日）</span>。<br>
      效期色标：<span class="dot" style="background:#dc2626"></span>&lt;20%（临期风险） · <span class="dot" style="background:#f59e0b"></span>20%–50% · <span class="dot" style="background:#16a34a"></span>≥50%（较新鲜）。格式为「最差% → 最好%」。
    </div>
  </section>
</div>

<div class="overlay" id="overlay">
  <div class="modal" id="modal">
    <div class="m-head">
      <div>
        <h3 id="mTitle"></h3>
        <div class="sub" id="mSub"></div>
      </div>
      <button class="m-close" id="mClose" title="关闭">×</button>
    </div>
    <div class="m-body" id="mBody"></div>
  </div>
</div>

  return String(d).replace(/^ETA\s*2026\s*/, 'ETA ');
}

document.getElementById('nBase').textContent = S.n_base;
document.getElementById('genDate').textContent = S.gen_date;

// 工具栏高度自适应：搜索/筛选条滚动时固定在顶部，
// 同时把表头 sticky top 设为该高度，避免表头被工具栏遮挡。
function updateStickyOffset(){
  const tb = document.querySelector('.toolbar');
  if(!tb) return;
  const h = tb.offsetHeight;
  document.documentElement.style.setProperty('--toolbar-h', h+'px');
}
window.addEventListener('load', updateStickyOffset);
window.addEventListener('resize', updateStickyOffset);
// 控件内字体/换行变化也可能影响高度，监听一次输入事件做兜底重测
['qGnc','qSap','qUpc','qName'].forEach(id=>{
  document.getElementById(id).addEventListener('input', updateStickyOffset);
});
updateStickyOffset();

// 风险商品（售止/下市/停产）统计与一键筛选
const riskPattern = /售止|下市|停产/;
const riskTotal = R.filter(r => riskPattern.test(r.remark||'')).length;
document.getElementById('riskCount').textContent = riskTotal;

// ---- table headers (built dynamically) ----
const COLS = [
  {k:'seq',          label:'序号',         l:true},
  {k:'gnc_code',     label:'CODE',        l:true},
  {k:'sap_code',     label:'产品编码',     l:true},
  {k:'upc',          label:'UPC',         l:true,  text:true, cellCls:'upc-cell'},
  {k:'name',         label:'产品名称',     l:true,  cellCls:'name-cell'},
  {k:'jiyi',         label:'极易可用库存',  cls:'grp-hi'},
  {k:'brand',        label:'品牌可用库存',  cls:'grp-bi'},
];
const JPLAN_DATES = DATA.jplan_date_cols;
JPLAN_DATES.forEach(d => COLS.push({k:'jplan_'+d, label: mdLabel(d,'极易到货'), cls:'grp-jp'}));
DATES.forEach(d => COLS.push({k:'plan_'+d, label: mdLabel(d,'品牌到货'), cls:'grp-pl'}));
const ETA_COLS = DATA.eta_cols || [];                              // 品牌到货 ETA 段（月区间聚合）
ETA_COLS.forEach(d => COLS.push({k:'eta_'+d, label: etaLabel(d), cls:'grp-eta'}));
// 极易/品牌 剩余效期(最差→最好) — 数据源: 极易库存 / 品牌库存
COLS.push({k:'jiyi_shelf_worst',  label:'极易剩余效期(最差→最好)',  cls:'grp-hi', shelf:'jiyi'});
COLS.push({k:'brand_shelf_worst', label:'品牌剩余效期(最差→最好)',  cls:'grp-bi', shelf:'brand'});
// 备注列放至最后（避免挤压中间数字列宽，导致效期列换行）
COLS.push({k:'remark', label:'备注', l:true, cellCls:'remark-cell'});

document.getElementById('theadRow').innerHTML = COLS.map(c =>
  '<th'+(c.l?' class="l"':'')+' data-k="'+c.k+'">'+(c.cls?'<span class="'+c.cls+'">'+c.label+'</span>':c.label)+'</th>'
).join('');

const maxv = {
  jiyi: Math.max(1, ...R.map(r=>r.jiyi)),
  brand: Math.max(1, ...R.map(r=>r.brand)),
};
DATES.forEach(d => { maxv['plan_'+d] = Math.max(1, ...R.map(r=>r['plan_'+d]||0)); });
ETA_COLS.forEach(d => { maxv['eta_'+d] = Math.max(1, ...R.map(r=>r['eta_'+d]||0)); });
JPLAN_DATES.forEach(d => { maxv['jplan_'+d] = Math.max(1, ...R.map(r=>r['jplan_'+d]||0)); });

function miniBar(v,key,color){
  return '<div class="minibar"><i style="width:'+(v/maxv[key]*100).toFixed(1)+'%;background:'+color+'"></i></div>';
}
// 剩余效期色标: <20% 红(临期) / 20-50% 橙 / >=50% 绿
function slColor(v){ if(v==null) return '#9ca3af'; if(v<20) return '#dc2626'; if(v<50) return '#f59e0b'; return '#16a34a'; }
function pct(v){ return v==null ? '—' : Math.floor(v)+'%'; }
function slCell(worst, best){
  if(worst==null && best==null) return '<span style="color:#9ca3af">—</span>';
  if(worst==null) return '<span style="color:'+slColor(best)+'">'+pct(best)+'</span>';
  if(best==null) return '<span style="color:'+slColor(worst)+'">'+pct(worst)+'</span>';
  if(worst===best) return '<span style="color:'+slColor(worst)+'">'+pct(worst)+'</span>';
  return '<span style="color:'+slColor(worst)+'">'+pct(worst)+'</span> → '+
         '<span style="color:'+slColor(best)+'">'+pct(best)+'</span>';
}

// 从备注中提取风险状态徽章（售止/下市/停产 可同时命中多个）
function row(r){
  // 备注含「售止/下市/停产」→ 整行红色（风险商品，优先级最高，覆盖橙色行）
  const remarkTxt = (r.remark||'').toString();
  const riskBad = /售止|下市|停产/.test(remarkTxt);
  // 极易库存为 0 但品牌仍有库存 → 橙色行（需向品牌方采货）
  const need = riskBad ? ' class="row-danger"'
               : ((r.jiyi<=0 && r.brand>0) ? ' style="background:#fff7ed;"' : '');
  let html = '<tr'+need+'>';
  COLS.forEach(c=>{
    let v = r[c.k];
    let cell;
    if(c.k==='jiyi')       cell = fmt(v);
    else if(c.k==='brand') cell = fmt(v);
    else if(c.k.startsWith('plan_') || c.k.startsWith('jplan_') || c.k.startsWith('eta_')){
      cell = fmt(v);
    }
    else if(c.shelf){
      cell = slCell(r[c.shelf+'_shelf_worst'], r[c.shelf+'_shelf_best']);
    }
    else if(c.text)        cell = esc(v);   // UPC: keep raw text incl. leading zeros
    else                   cell = esc(v);
    let cls = '';
    if(c.l) cls += 'l';
    if(c.text) cls += (cls?' ':'') + 'code';
    if(c.cellCls) cls += (cls?' ':'') + c.cellCls;
    let extra = '';
    if(c.k==='jiyi' || c.k==='brand'){
      cls += (cls?' ':'') + 'clickable';
      extra = ' data-upc="'+esc(r.upc)+'" data-src="'+c.k+'" title="点击查看效期明细"';
    }
    html += '<td'+(cls?' class="'+cls+'"':'')+extra+'>'+cell+'</td>';
  });
  return html+'</tr>';
}

// 合计行：仅对当前筛选后可见的产品求和（数量列）；效期列不汇总，显示「—」
function totalRow(rows){
  const sumKeys = ['jiyi','brand']
    .concat(JPLAN_DATES.map(d=>'jplan_'+d))
    .concat(DATES.map(d=>'plan_'+d))
    .concat(ETA_COLS.map(d=>'eta_'+d));
  const totals = {};
  sumKeys.forEach(k=> totals[k] = rows.reduce((s,r)=> s + (Number(r[k])||0), 0));
  let html = '';
  COLS.forEach((c,i)=>{
    if(i===0) html += '<td class="total-label">合计 ('+rows.length+')</td>';
    else if(c.k==='jiyi' || c.k==='brand' || c.k.startsWith('plan_') || c.k.startsWith('jplan_') || c.k.startsWith('eta_'))
      html += '<td>'+fmt(totals[c.k])+'</td>';
    else if(c.shelf) html += '<td class="total-na">—</td>';
    else html += '<td></td>';
  });
  return html;
}

let sortKey='seq', sortDir=1;   // 默认严格按产品清单顺序（序号升序）
function render(){
  // 四个独立搜索框：每个仅匹配自身字段，互不影响；多个条件之间为 AND 组合
  const qSap = document.getElementById('qSap').value.trim().toLowerCase();
  const qName= document.getElementById('qName').value.trim().toLowerCase();
  const qUpc = document.getElementById('qUpc').value.trim().toLowerCase();
  const qGnc = document.getElementById('qGnc').value.trim().toLowerCase();
  const fj=document.getElementById('fJiyi').checked,
        fb=document.getElementById('fBrand').checked,
        fp=document.getElementById('fPlan').checked,
        fRisk=document.getElementById('fRisk').checked;
  let rows = R.filter(r=>{
    if(qSap  && !(r.sap_code  || '').toLowerCase().includes(qSap )) return false;
    if(qName && !(r.name      || '').toLowerCase().includes(qName)) return false;
    if(qUpc  && !(r.upc       || '').toLowerCase().includes(qUpc )) return false;
    if(qGnc  && !(r.gnc_code  || '').toLowerCase().includes(qGnc )) return false;
    if(fj && r.jiyi<=0) return false;
    if(fb && r.brand<=0) return false;
    if(fp && DATES.every(d => !(r['plan_'+d]>0)) && JPLAN_DATES.every(d => !(r['jplan_'+d]>0)) && ETA_COLS.every(d => !(r['eta_'+d]>0))) return false;
    if(fRisk && !riskPattern.test(r.remark||'')) return false;
    return true;
  });
  rows.sort((a,b)=>{
    let x=a[sortKey], y=b[sortKey];
    if(typeof x==='string'){ return sortDir*x.localeCompare(y,'zh'); }
    x=x==null?-1:x; y=y==null?-1:y; return sortDir*(x-y);
  });
  document.getElementById('tbody').innerHTML = rows.length? rows.map(row).join('') : '<tr><td colspan="'+(COLS.length)+'" class="empty">无匹配数据</td></tr>';
  document.getElementById('tfoot').innerHTML = rows.length? '<tr class="total-row">'+totalRow(rows)+'</tr>' : '';
}

document.querySelectorAll('th[data-k]').forEach(th=>{
  th.addEventListener('click',()=>{
    const k=th.dataset.k;
    if(sortKey===k) sortDir*=-1;
    else { sortKey=k; sortDir = (['upc','name','gnc_code','sap_code','remark','jiyi_shelf_worst','brand_shelf_worst'].includes(k))?1:-1; }
    render();
  });
});
['qSap','qName','qUpc','qGnc','fJiyi','fBrand','fPlan','fRisk'].forEach(id=>document.getElementById(id).addEventListener('input',render));

// ---- CSV export (UPC as text, preserve leading zeros) ----
document.getElementById('exportBtn').addEventListener('click',()=>{
  const head = ['序号','CODE','产品编码','UPC','产品名称',
                '极易可用库存','品牌可用库存']
               .concat(JPLAN_DATES.map(d=>mdLabel(d,'极易到货')))
               .concat(DATES.map(d=>mdLabel(d,'品牌到货')))
               .concat(ETA_COLS.map(d=>etaLabel(d)+'品牌到货'))
               .concat(['极易剩余效期(最差→最好)','品牌剩余效期(最差→最好)','备注']);
  const lines = [head.join(',')];
  R.forEach(r=>{
    const jShelf = (r.jiyi_shelf_worst==null||r.jiyi_shelf_best==null) ? ''
      : (Math.floor(r.jiyi_shelf_worst)+'% → '+Math.floor(r.jiyi_shelf_best)+'%');
    const bShelf = (r.brand_shelf_worst==null||r.brand_shelf_best==null) ? ''
      : (Math.floor(r.brand_shelf_worst)+'% → '+Math.floor(r.brand_shelf_best)+'%');
    const row = [r.seq, r.gnc_code, r.sap_code, r.upc, r.name,
                 r.jiyi, r.brand]
                .concat(JPLAN_DATES.map(d=>r['jplan_'+d]||0))
                .concat(DATES.map(d=>r['plan_'+d]||0))
                .concat(ETA_COLS.map(d=>r['eta_'+d]||0))
                .concat([jShelf, bShelf, r.remark]);
    lines.push(row.join(','));
  });
  const blob = new Blob(['\ufeff'+lines.join('\n')],{type:'text/csv;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = '库存和到货计划_'+S.gen_date.replace(/[: ]/g,'-')+'.csv';
  a.click();
});

// ---- 钻取明细：点击极易/品牌可用库存数字，按效期合并展示 ----
function showDetail(upc, src){
  const rec = R.find(r => r.upc === upc);
  const name = rec ? rec.name : '';
  const det = ((src === 'jiyi') ? DATA.details.jiyi : DATA.details.brand)[upc] || [];
  const srcName = (src === 'jiyi') ? '极易库存效期明细' : '品牌库存效期明细';
  const fieldName = (src === 'jiyi') ? '极易可用库存' : '品牌可用库存';
  document.getElementById('mTitle').textContent = srcName + ' · UPC ' + upc;
  document.getElementById('mSub').textContent =
    (name ? '产品：' + name + '　·　' : '') + '按剩余效期合并（相同效期汇总为一行）';
  if(!det.length){
    document.getElementById('mBody').innerHTML =
      '<div class="empty">该 UPC 在' + (src==='jiyi'?'极易':'品牌') + '库存中无明细记录。</div>';
    document.getElementById('overlay').classList.add('show');
    return;
  }
  const total = det.reduce((a,b)=>a+b.qty, 0);
  const mainVal = rec ? (src==='jiyi' ? rec.jiyi : rec.brand) : 0;
  const showMdate = (src === 'jiyi');
  const rows = det.map(x=>{
    const c = slColor(x.pct);
    return '<tr>'
      + '<td class="l"><span style="color:'+c+'">'+x.pct.toFixed(2)+'%</span></td>'
      + '<td>'+Number(x.qty).toLocaleString('zh-CN')+'</td>'
      + '<td class="l">'+(x.edate ? esc(x.edate) : '—')+'</td>'
      + (showMdate ? '<td class="l">'+(x.mdate ? esc(x.mdate) : '—')+'</td>' : '')
      + '</tr>';
  }).join('');
  const ok = (total === mainVal);
  document.getElementById('mBody').innerHTML =
    '<table><thead><tr>'
    + '<th class="l">剩余效期</th><th>数量（合并）</th><th class="l">最早到日期 / 有效期至</th>'
    + (showMdate ? '<th class="l">生产日期</th>' : '')
    + '</tr></thead><tbody>'+rows+'</tbody></table>'
    + '<div class="m-tot">合计数量：<b>'+Number(total).toLocaleString('zh-CN')+'</b> 件　·　与主表「'+fieldName+'」'
    + (ok ? ' <span class="ok">✅ 一致</span>' : ' <span class="warn">⚠️ 不一致('+mainVal+')</span>')
    + '　·　共 '+det.length+' 个效期档位</div>';
  document.getElementById('overlay').classList.add('show');
}
// 事件委托：明细表里的可点击单元格
document.getElementById('tbody').addEventListener('click', e=>{
  const td = e.target.closest('td.clickable');
  if(!td) return;
  showDetail(td.getAttribute('data-upc'), td.getAttribute('data-src'));
});
document.getElementById('overlay').addEventListener('click', e=>{
  if(e.target.id === 'overlay' || e.target.id === 'mClose')
    document.getElementById('overlay').classList.remove('show');
});
document.addEventListener('keydown', e=>{
  if(e.key === 'Escape') document.getElementById('overlay').classList.remove('show');
});

render();
</script>
</body>
